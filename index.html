<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none; /* 防止手机长按弹出菜单 */
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fbfbfd; /* Apple 官网标志性极浅灰白 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 顶部现代科技感仪表盘 */
        #hud-layer {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 12px 24px;
            border-radius: 30px;
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.05em;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }
        /* 优雅的苹果风格系统弹窗 */
        #alert-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }
        #alert-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .apple-alert {
            background: rgba(255, 255, 255, 0.9 base);
            background: #ffffff;
            width: 280px;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0,0,0,0.05);
        }
        #alert-overlay.show .apple-alert {
            transform: scale(1);
        }
        .alert-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .alert-body {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .alert-btn {
            background: #0071e3; /* Apple 官方蓝色 */
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="hud-layer">STATUS: READY / HITS: 0</div>
    <canvas id="canvas"></canvas>

    <!-- 苹果风格确认弹窗 -->
    <div id="alert-overlay">
        <div class="apple-alert">
            <div class="alert-title">通知</div>
            <div class="alert-body">清除完毕。<br>目标“张思远”已挂。</div>
            <button class="alert-btn" onclick="closeAlert()">好</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudLayer = document.getElementById('hud-layer');
    const alertOverlay = document.getElementById('alert-overlay');

    // 屏幕适配
    function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // 初始状态与控制变量
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let hitCount = 0;
    let bloodParticles = [];
    let isDead = false;
    let screenShake = 0;
    let fallAngle = 0; // 倒地旋转角度
    let isDragging = false;

    // 极简小人属性
    const stickman = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2 + 60,
        scale: 1.1
    };

    // 移动端多点触控与滑动重写
    window.addEventListener('touchstart', (e) => {
        isDragging = true;
        const touch = e.touches[0];
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        mouse.x = touch.clientX;
        mouse.y = touch.clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
        isDragging = false;
        // 单击或者释放时执行开火
        fireWeapon();
    });

    // 同时也保留 PC 端的鼠标兼容支持
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    window.addEventListener('mousedown', () => {
        fireWeapon();
    });

    // 高级感血液粒子类（红夹克设计：更浅的轻量艺术喷溅，不过度血腥）
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = Math.random() * 5 + 1; 
            this.radius = Math.random() * 3 + 1.5;
            this.alpha = 0.9;
            this.gravity = 0.2;
            // 采用带高级感的半透明浅绯红
            this.color = 'rgba(234, 67, 53,'; 
        }
        update() {
            this.x += this.vx;
            this.vy += this.gravity;
            this.y += this.vy;
            this.alpha -= 0.015;
        }
        draw(c) {
            c.save();
            c.fillStyle = `${this.color}${this.alpha})`;
            c.beginPath();
            c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            c.fill();
            c.restore();
        }
    }

    // 开火核心逻辑
    function fireWeapon() {
        if (alertOverlay.classList.contains('show')) return;

        hitCount++;
        screenShake = 8; // 极其克制而平滑的后坐力抖动

        // 精准定位下体打击点
        const crotchX = stickman.x;
        const crotchY = stickman.y + 35 * stickman.scale;

        // 产生喷溅
        for (let i = 0; i < 25; i++) {
            bloodParticles.push(new Particle(crotchX, crotchY));
        }

        // 更新HUD
        hudLayer.innerText = `STATUS: ENGAGED / HITS: ${hitCount}`;

        // 击中第5次触发逻辑
        if (hitCount === 5) {
            isDead = true;
            hudLayer.innerText = `STATUS: TARGET ELIMINATED`;
            // 延迟弹出苹果风格弹窗，等倒地动画做完
            setTimeout(() => {
                alertOverlay.classList.add('show');
            }, 600);
        }
    }

    function closeAlert() {
        alertOverlay.classList.remove('show');
    }

    // 渲染主循环
    function animate() {
        // 背景刷新
        ctx.fillStyle = '#fbfbfd';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.save();
        // 处理镜头震动衰减
        if (screenShake > 0) {
            const dx = (Math.random() - 0.5) * screenShake;
            const dy = (Math.random() - 0.5) * screenShake;
            ctx.translate(dx, dy);
            screenShake *= 0.85;
            if (screenShake < 0.2) screenShake = 0;
        }

        // ==================== 1. 绘制极简小人 (Apple Style) ====================
        const s = stickman.scale;
        
        ctx.save();
        // 缓动倒地物理动画
        if (isDead) {
            if (fallAngle < Math.PI / 2) {
                fallAngle += (Math.PI / 2 - fallAngle) * 0.12; // 丝滑的缓动下落
            }
            ctx.translate(stickman.x, stickman.y + 60);
            ctx.rotate(fallAngle);
            ctx.translate(-stickman.x, -stickman.y - 60);
        }

        // 炭黑色极细线条，符合苹果一贯的冷淡高级感
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#1d1d1f';
        ctx.fillStyle = '#1d1d1f';

        // 目标文本
        ctx.font = '500 13px -apple-system';
        ctx.textAlign = 'center';
        ctx.fillText("张思远", stickman.x, stickman.y - 45 * s);

        // 头（无缝正圆）
        ctx.beginPath();
        ctx.arc(stickman.x, stickman.y - 15 * s, 10 * s, 0, Math.PI * 2);
        ctx.stroke();

        // 身体
        ctx.beginPath();
        ctx.moveTo(stickman.x, stickman.y - 5 * s);
        ctx.lineTo(stickman.x, stickman.y + 35 * s);
        ctx.stroke();

        // 胳膊
        ctx.beginPath();
        ctx.moveTo(stickman.x - 20 * s, stickman.y + 8 * s);
        ctx.lineTo(stickman.x + 20 * s, stickman.y + 8 * s);
        ctx.stroke();

        // 双腿
        const crotchY = stickman.y + 35 * s;
        ctx.beginPath();
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x - 12 * s, stickman.y + 70 * s);
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x + 12 * s, stickman.y + 70 * s);
        ctx.stroke();

        // 下体累计受击反馈红点
        if (hitCount > 0) {
            ctx.fillStyle = 'rgba(234, 67, 53, 0.8)';
            ctx.beginPath();
            ctx.arc(stickman.x, crotchY + 3, Math.min(4 + hitCount * 1.5, 20), 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // ==================== 2. 渲染血液粒子 ====================
        for (let i = bloodParticles.length - 1; i >= 0; i--) {
            bloodParticles[i].update();
            bloodParticles[i].draw(ctx);
            if (bloodParticles[i].alpha <= 0) {
                bloodParticles.splice(i, 1);
            }
        }

        ctx.restore(); // 结束震动

        // ==================== 3. 绘制苹果风格高科技十字瞄准镜 ====================
        ctx.save();
        // 极细微深灰线条
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.4)';
        ctx.lineWidth = 1;

        // 外部大虚线环
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 140, 0, Math.PI * 2);
        ctx.setLineDash([4, 12]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 内部精准实线锁定环
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.8)';
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 45, 0, Math.PI * 2);
        ctx.stroke();

        // 极简标尺刻度十字线
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.2)';
        ctx.beginPath();
        // 左 / 右
        ctx.moveTo(mouse.x - 180, mouse.y); ctx.lineTo(mouse.x - 55, mouse.y);
        ctx.moveTo(mouse.x + 55, mouse.y); ctx.lineTo(mouse.x + 180, mouse.y);
        // 上 / 下
        ctx.moveTo(mouse.x, mouse.y - 180); ctx.lineTo(mouse.x, mouse.y - 55);
        ctx.moveTo(mouse.x, mouse.y + 55); ctx.lineTo(mouse.x, mouse.y + 180);
        ctx.stroke();

        // 中央精细打击红点
        ctx.fillStyle = '#ea4335';
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
