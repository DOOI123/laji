<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fbfbfd; /* Apple 经典白色 */
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* HUD 仪表盘 */
        #hud-layer {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 12px 28px;
            border-radius: 30px;
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.06em;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            z-index: 5;
        }
        /* Apple 风格弹窗 */
        #alert-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }
        #alert-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .apple-alert {
            background: #ffffff;
            width: 275px;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0,0,0,0.04);
        }
        #alert-overlay.show .apple-alert {
            transform: scale(1);
        }
        .alert-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .alert-body {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .alert-btn {
            background: #0071e3;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="hud-layer">AUTO LOCK: ON / HITS: 0</div>
    <canvas id="canvas"></canvas>

    <div id="alert-overlay">
        <div class="apple-alert">
            <div class="alert-title">提示</div>
            <div class="alert-body">清除完毕。<br>目标“张思远”已挂。</div>
            <button class="alert-btn" onclick="closeAlert()">好</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudLayer = document.getElementById('hud-layer');
    const alertOverlay = document.getElementById('alert-overlay');

    let w = window.innerWidth;
    let h = window.innerHeight;

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * window.devicePixelRatio;
        canvas.height = h * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // 状态与物理控制变量
    let hitCount = 0;
    let bloodParticles = [];
    let isDead = false;
    let alertTriggered = false;
    
    let screenShake = 0;
    let fallAngle = 0;        // 身体翻滚旋转角度
    let rotSpeed = 0;        // 旋转速度

    // 小人物理结构体
    const stickman = {
        x: w / 2,
        y: h / 2 + 30,
        vx: 0,            // 横向速度
        vy: 0,            // 纵向速度
        radius: 50,       // 用于碰撞检测的近似边缘半径
        scale: 1.15
    };

    // 环境物理常数
    const gravity = 0.25;     // 重力
    const airResistance = 0.985; // 空气阻力/摩擦力
    const bounce = -0.75;     // 边缘碰撞反弹系数（带轻微能量损耗）

    // 获取小人下体（受击点）在世界坐标系中的真实投影位置
    function getCrotchCoords() {
        const s = stickman.scale;
        const baseCrotchY = stickman.y + 35 * s;
        
        if (!isDead) {
            return { x: stickman.x, y: baseCrotchY };
        } else {
            // 倒地或乱飘状态下，围绕骨骼中心点（脊椎中段）进行矩阵旋转计算
            const pivotX = stickman.x;
            const pivotY = stickman.y + 30 * s;
            const localX = 0;
            const localY = baseCrotchY - pivotY;

            const cos = Math.cos(fallAngle);
            const sin = Math.sin(fallAngle);
            return {
                x: pivotX + (localX * cos - localY * sin),
                y: pivotY + (localX * sin + localY * cos)
            };
        }
    }

    // 点击事件监听（多端兼容）
    window.addEventListener('touchstart', (e) => {
        if (alertOverlay.classList.contains('show')) return;
        e.preventDefault();
        fireWeapon();
    }, { passive: false });

    window.addEventListener('mousedown', (e) => {
        if (alertOverlay.classList.contains('show')) return;
        fireWeapon();
    });

    // 优雅流体血流粒子
    class Particle {
        constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.radius = Math.random() * 2.5 + 1.2;
            this.alpha = 1;
            this.decay = Math.random() * 0.015 + 0.01;
            this.color = 'rgba(234, 67, 53,'; // Apple Premium Red
        }
        update() {
            this.x += this.vx;
            this.vy += 0.15; // 粒子自身受微量重力
            this.y += this.vy;
            this.alpha -= this.decay;
        }
        draw(c) {
            c.save();
            c.fillStyle = `${this.color}${this.alpha})`;
            c.beginPath();
            c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            c.fill();
            c.restore();
        }
    }

    // 触发开火核心机制
    function fireWeapon() {
        hitCount++;
        screenShake = 12; // 镜头后坐力

        const target = getCrotchCoords();

        // 瞬间生成爆发性喷溅粒子
        for (let i = 0; i < 20; i++) {
            const pVx = (Math.random() - 0.5) * 8 + stickman.vx * 0.5;
            const pVy = (Math.random() - 0.5) * 8 + stickman.vy * 0.5;
            bloodParticles.push(new Particle(target.x, target.y, pVx, pVy));
        }

        // 倒地之后的受击：触发空中疯狂无规则乱飘
        if (isDead) {
            // 给小人施加一个巨大的、随机方向的爆发冲击力
            const angle = Math.random() * Math.PI * 2;
            const force = Math.random() * 12 + 18; // 强劲的冲量
            stickman.vx = Math.cos(angle) * force;
            stickman.vy = Math.sin(angle) * force;
            
            // 增加翻滚角速度
            rotSpeed = (Math.random() - 0.5) * 0.6;
        }

        hudLayer.innerText = `AUTO LOCK: ON / HITS: ${hitCount}`;

        // 满 5 枪击毙
        if (hitCount === 5) {
            isDead = true;
            rotSpeed = 0.15;
            // 给予初次击飞向上的微弱力
            stickman.vy = -8;
            hudLayer.innerText = `TARGET ELIMINATED`;
            
            if (!alertTriggered) {
                alertTriggered = true;
                setTimeout(() => {
                    alertOverlay.classList.add('show');
                }, 600);
            }
        }
    }

    function closeAlert() {
        alertOverlay.classList.remove('show');
    }

    // 核心渲染与物理仿真引擎循环
    function animate() {
        // 每帧擦除，高质感白底
        ctx.fillStyle = '#fbfbfd';
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        // 1. 模拟画面震动
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.85;
            if (screenShake < 0.2) screenShake = 0;
        }

        // 2. 倒地后的高级完整物理世界演算
        if (isDead) {
            // 应用环境物理力：重力与空气阻力
            stickman.vy += gravity;
            stickman.vx *= airResistance;
            stickman.vy *= airResistance;

            // 更新位移和旋转
            stickman.x += stickman.vx;
            stickman.y += stickman.vy;
            fallAngle += rotSpeed;
            rotSpeed *= 0.99; // 旋转阻尼

            // ---- 安全边界碰撞检测 (防止小人飘出屏幕) ----
            const margin = 40; // 边缘安全间距
            
            // 左右边界碰撞反弹
            if (stickman.x < margin) {
                stickman.x = margin;
                stickman.vx *= bounce;
                rotSpeed += (Math.random() - 0.5) * 0.2; // 撞墙产生扭矩旋转
            } else if (stickman.x > w - margin) {
                stickman.x = w - margin;
                stickman.vx *= bounce;
                rotSpeed += (Math.random() - 0.5) * 0.2;
            }

            // 上下边界碰撞反弹
            if (stickman.y < margin) {
                stickman.y = margin;
                stickman.vy *= bounce;
            } else if (stickman.y > h - margin - 30) {
                stickman.y = h - margin - 30;
                stickman.vy *= bounce;
                // 地面摩擦：如果速度过小则静止
                stickman.vx *= 0.9; 
            }

            // ---- 核心追加功能：在空中移动时，下体无间断主动流血尾迹 ----
            const speed = Math.sqrt(stickman.vx * stickman.vx + stickman.vy * stickman.vy);
            if (speed > 1) {
                const currentCrotch = getCrotchCoords();
                // 每帧在下体动态生成1-2颗自然滴落的流血粒子
                if (Math.random() > 0.3) {
                    bloodParticles.push(new Particle(
                        currentCrotch.x, 
                        currentCrotch.y, 
                        (Math.random() - 0.5) * 2 - stickman.vx * 0.1, // 留滞空气的阻力感
                        (Math.random() - 0.5) * 2 - stickman.vy * 0.1
                    ));
                }
            }
        }

        // ==================== 绘制骨骼小人 ====================
        const s = stickman.scale;
        
        ctx.save();
        if (isDead) {
            // 围绕身体中心平移旋转
            ctx.translate(stickman.x, stickman.y + 30 * s);
            ctx.rotate(fallAngle);
            ctx.translate(-stickman.x, -stickman.y - 30 * s);
        }

        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#1d1d1f';
        ctx.fillStyle = '#1d1d1f';

        // 艺术字体名字
        ctx.font = '500 13px -apple-system, BlinkMacSystemFont';
        ctx.textAlign = 'center';
        ctx.fillText("张思远", stickman.x, stickman.y - 45 * s);

        // 头
        ctx.beginPath();
        ctx.arc(stickman.x, stickman.y - 15 * s, 10 * s, 0, Math.PI * 2);
        ctx.stroke();

        // 躯干
        ctx.beginPath();
        ctx.moveTo(stickman.x, stickman.y - 5 * s);
        ctx.lineTo(stickman.x, stickman.y + 35 * s);
        ctx.stroke();

        // 上肢
        ctx.beginPath();
        ctx.moveTo(stickman.x - 18 * s, stickman.y + 8 * s);
        ctx.lineTo(stickman.x + 18 * s, stickman.y + 8 * s);
        ctx.stroke();

        // 下肢
        const crotchY = stickman.y + 35 * s;
        ctx.beginPath();
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x - 12 * s, stickman.y + 70 * s);
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x + 12 * s, stickman.y + 70 * s);
        ctx.stroke();

        // 受击核心扩散红晕反馈
        if (hitCount > 0) {
            ctx.fillStyle = 'rgba(234, 67, 53, 0.85)';
            ctx.beginPath();
            ctx.arc(stickman.x, crotchY + 3, Math.min(4 + hitCount * 1.2, 24), 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // ==================== 渲染与回收粒子系统 ====================
        for (let i = bloodParticles.length - 1; i >= 0; i--) {
            bloodParticles[i].update();
            bloodParticles[i].draw(ctx);
            if (bloodParticles[i].alpha <= 0) {
                bloodParticles.splice(i, 1);
            }
        }

        ctx.restore(); // 退出震动矩阵

        // ==================== 实时强追踪智能化狙击镜 ====================
        const crosshairTarget = getCrotchCoords();

        ctx.save();
        ctx.lineWidth = 1;

        // 外部微调环
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.25)';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 125, 0, Math.PI * 2);
        ctx.setLineDash([4, 10]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 内部核心锁定环
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.75)';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 42, 0, Math.PI * 2);
        ctx.stroke();

        // 极简十字刻度
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.12)';
        ctx.beginPath();
        ctx.moveTo(crosshairTarget.x - 155, crosshairTarget.y); ctx.lineTo(crosshairTarget.x - 50, crosshairTarget.y);
        ctx.moveTo(crosshairTarget.x + 50, crosshairTarget.y); ctx.lineTo(crosshairTarget.x + 155, crosshairTarget.y);
        ctx.moveTo(crosshairTarget.x, crosshairTarget.y - 155); ctx.lineTo(crosshairTarget.x, crosshairTarget.y - 50);
        ctx.moveTo(crosshairTarget.x, crosshairTarget.y + 50); ctx.lineTo(crosshairTarget.x, crosshairTarget.y + 155);
        ctx.stroke();

        // 精准制导红点
        ctx.fillStyle = '#ea4335';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
