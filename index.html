<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Simulation Pro</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fbfbfd; /* 苹果经典浅白 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 顶部 Apple 风格毛玻璃 HUD */
        #hud-layer {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.75);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 12px 28px;
            border-radius: 30px;
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.06em;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            z-index: 5;
        }
        /* 标志性 Apple 原生系统弹窗组件 */
        #alert-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }
        #alert-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .apple-alert {
            background: #ffffff;
            width: 275px;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(0,0,0,0.04);
        }
        #alert-overlay.show .apple-alert {
            transform: scale(1);
        }
        .alert-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
        }
        .alert-body {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .alert-btn {
            background: #0071e3;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="hud-layer">LOCK ON: CROTCH / HITS: 0</div>
    <canvas id="canvas"></canvas>

    <!-- 弹窗 -->
    <div id="alert-overlay">
        <div class="apple-alert">
            <div class="alert-title">提示</div>
            <div class="alert-body">清除完毕。<br>目标“张思远”已挂。</div>
            <button class="alert-btn" onclick="closeAlert()">好</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudLayer = document.getElementById('hud-layer');
    const alertOverlay = document.getElementById('alert-overlay');

    function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    // 核心游戏逻辑与物理变量
    let hitCount = 0;
    let bloodParticles = [];
    let isDead = false;
    let alertTriggered = false;
    
    let screenShake = 0;      // 屏幕震动衰减系数
    let fallAngle = 0;        // 站立/倒地状态倾斜角
    let bodyHitPulse = 0;     // 倒地后受击震颤力
    
    // 物理平移速度与摩擦力设定
    let velocityX = 0;        
    const friction = 0.88;    // 地面摩擦系数力

    // 骨骼基础配置（锁定视口中央）
    const stickman = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2 + 30,
        scale: 1.15
    };

    // 获取当前动态的下体受击核心坐标 (随着骨骼倒地/位移实时改变)
    function getCrotchCoords() {
        const s = stickman.scale;
        const baseCrotchY = stickman.y + 35 * s;
        
        if (!isDead) {
            return { x: stickman.x, y: baseCrotchY };
        } else {
            // 倒地旋转 90 度后的全新矩阵投影点
            // 围绕旋转原点 (stickman.x, stickman.y + 60) 进行三角函数映射
            const pivotX = stickman.x;
            const pivotY = stickman.y + 60;
            const localCrotchX = 0;
            const localCrotchY = baseCrotchY - pivotY;

            // 旋转几何映射
            const cos = Math.cos(fallAngle);
            const sin = Math.sin(fallAngle);
            return {
                x: pivotX + (localCrotchX * cos - localCrotchY * sin),
                y: pivotY + (localCrotchX * sin + localCrotchY * cos)
            };
        }
    }

    // 单击屏幕任意区域触发精确打击
    window.addEventListener('touchstart', (e) => {
        // 如果当前有弹窗拦截，点击只处理弹窗
        if (alertOverlay.classList.contains('show')) return;
        e.preventDefault();
        fireWeapon();
    }, { passive: false });

    window.addEventListener('mousedown', (e) => {
        if (alertOverlay.classList.contains('show')) return;
        fireWeapon();
    });

    // 高级感流体喷溅粒子
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            // 根据倒地状态调整喷溅方向
            if (!isDead) {
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = Math.random() * 4 + 1; 
            } else {
                // 倒地后受到向右的作用力，血液往右斜上方喷溅
                this.vx = Math.random() * 6 + 1;
                this.vy = -(Math.random() * 4 + 1);
            }
            this.radius = Math.random() * 2.5 + 1.5;
            this.alpha = 0.95;
            this.gravity = isDead ? 0.15 : 0.22;
            this.color = 'rgba(234, 67, 53,'; // 苹果高定红
        }
        update() {
            this.x += this.vx;
            this.vy += this.gravity;
            this.y += this.vy;
            this.alpha -= 0.016;
        }
        draw(c) {
            c.save();
            c.fillStyle = `${this.color}${this.alpha})`;
            c.beginPath();
            c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            c.fill();
            c.restore();
        }
    }

    // 核心开火行为
    function fireWeapon() {
        hitCount++;
        screenShake = 10; // 枪械后坐力反馈

        // 无论如何变化，动态狙击自动定位最新下体坐标
        const currentTarget = getCrotchCoords();

        // 倒地后的额外动能反馈
        if (isDead) {
            velocityX = 15;        // 施加给小人向右横飞的物理初速度
            bodyHitPulse = 12;     // 施加肌肉受击抽搐动能
        }

        // 瞬间喷吐粒子
        for (let i = 0; i < 25; i++) {
            bloodParticles.push(new Particle(currentTarget.x, currentTarget.y));
        }

        hudLayer.innerText = `LOCK ON: CROTCH / HITS: ${hitCount}`;

        // 刚好满 5 枪，触发倒地结算机制
        if (hitCount === 5) {
            isDead = true;
            hudLayer.innerText = `TARGET ELIMINATED`;
            
            if (!alertTriggered) {
                alertTriggered = true;
                setTimeout(() => {
                    alertOverlay.classList.add('show');
                }, 650);
            }
        }
    }

    function closeAlert() {
        alertOverlay.classList.remove('show');
    }

    // 核心流式渲染循环
    function animate() {
        // 清屏
        ctx.fillStyle = '#fbfbfd';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.save();
        // 1. 处理镜头后坐力抖动
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.84;
            if (screenShake < 0.2) screenShake = 0;
        }

        // 2. 物理碰撞与位移模拟（倒地后的滑行运动）
        if (isDead && velocityX > 0) {
            stickman.x += velocityX;
            velocityX *= friction; // 摩擦力衰减
            if (velocityX < 0.05) velocityX = 0;
        }

        // ==================== 绘制小人主体 ====================
        const s = stickman.scale;
        
        ctx.save();
        // 计算受击震颤动能
        let pulseX = 0;
        if (bodyHitPulse > 0) {
            pulseX = (Math.random() - 0.5) * bodyHitPulse;
            bodyHitPulse *= 0.8;
        }

        // 应用位移和倒地翻转矩阵
        if (isDead) {
            if (fallAngle < Math.PI / 2) {
                fallAngle += (Math.PI / 2 - fallAngle) * 0.14; // 缓动流畅倾倒
            }
            ctx.translate(stickman.x + pulseX, stickman.y + 60);
            ctx.rotate(fallAngle);
            ctx.translate(-stickman.x, -stickman.y - 60);
        } else {
            ctx.translate(pulseX, 0);
        }

        // 极细炭黑美学线条
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#1d1d1f';
        ctx.fillStyle = '#1d1d1f';

        // 居中标签
        ctx.font = '500 13px -apple-system, BlinkMacSystemFont';
        ctx.textAlign = 'center';
        ctx.fillText("张思远", stickman.x, stickman.y - 45 * s);

        // 头部
        ctx.beginPath();
        ctx.arc(stickman.x, stickman.y - 15 * s, 10 * s, 0, Math.PI * 2);
        ctx.stroke();

        // 躯干
        ctx.beginPath();
        ctx.moveTo(stickman.x, stickman.y - 5 * s);
        ctx.lineTo(stickman.x, stickman.y + 35 * s);
        ctx.stroke();

        // 上肢
        ctx.beginPath();
        ctx.moveTo(stickman.x - 18 * s, stickman.y + 8 * s);
        ctx.lineTo(stickman.x + 18 * s, stickman.y + 8 * s);
        ctx.stroke();

        // 下肢
        const crotchY = stickman.y + 35 * s;
        ctx.beginPath();
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x - 12 * s, stickman.y + 70 * s);
        ctx.moveTo(stickman.x, crotchY);
        ctx.lineTo(stickman.x + 12 * s, stickman.y + 70 * s);
        ctx.stroke();

        // 实时渲染创伤扩散红点
        if (hitCount > 0) {
            ctx.fillStyle = 'rgba(234, 67, 53, 0.85)';
            ctx.beginPath();
            ctx.arc(stickman.x, crotchY + 3, Math.min(4 + hitCount * 1.3, 22), 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // ==================== 渲染血液流体粒子 ====================
        for (let i = bloodParticles.length - 1; i >= 0; i--) {
            bloodParticles[i].update();
            bloodParticles[i].draw(ctx);
            if (bloodParticles[i].alpha <= 0) {
                bloodParticles.splice(i, 1);
            }
        }

        ctx.restore(); // 退出镜头后坐力矩阵

        // ==================== 智能锁定的高级感狙击镜 ====================
        // 获取当前帧最新的、无论站立还是位移倒地后的下体精确中心点
        const crosshairTarget = getCrotchCoords();

        ctx.save();
        ctx.lineWidth = 1;

        // 1. 外层高级空气感虚线刻度环
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.3)';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 130, 0, Math.PI * 2);
        ctx.setLineDash([4, 10]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. 内层核心战术环
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.75)';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 40, 0, Math.PI * 2);
        ctx.stroke();

        // 3. 极简标尺线
        ctx.strokeStyle = 'rgba(29, 29, 31, 0.15)';
        ctx.beginPath();
        ctx.moveTo(crosshairTarget.x - 160, crosshairTarget.y); ctx.lineTo(crosshairTarget.x - 48, crosshairTarget.y);
        ctx.moveTo(crosshairTarget.x + 48, crosshairTarget.y); ctx.lineTo(crosshairTarget.x + 160, crosshairTarget.y);
        ctx.moveTo(crosshairTarget.x, crosshairTarget.y - 160); ctx.lineTo(crosshairTarget.x, crosshairTarget.y - 48);
        ctx.moveTo(crosshairTarget.x, crosshairTarget.y + 48); ctx.lineTo(crosshairTarget.x, crosshairTarget.y + 160);
        ctx.stroke();

        // 4. 精准锁定激光点
        ctx.fillStyle = '#ea4335';
        ctx.beginPath();
        ctx.arc(crosshairTarget.x, crosshairTarget.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(animate);
    }

    // 启动动画
    animate();
</script>
</body>
</html>
